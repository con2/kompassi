name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - kompassi/**
              - Dockerfile
              - .dockerignore
              - docker-compose.test.yml
              - sql/**
              - manage.py
              - pyproject.toml
              - uv.lock
              - .github/workflows/cicd.yaml
            frontend:
              - kompassi-v2-frontend/**
              - .github/workflows/cicd.yaml

  test_backend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      UV_PYTHON_DOWNLOADS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: test
          load: true
          tags: kompassi-test
          cache-from: |
            type=registry,ref=ghcr.io/con2/kompassi:buildcache
            type=registry,ref=ghcr.io/con2/kompassi:buildcache-test
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=registry,ref=ghcr.io/con2/kompassi:buildcache-test,mode=max' || '' }}
      - run: docker compose -f docker-compose.test.yml up --exit-code-from test

  test_frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: kompassi-v2-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kompassi-v2-frontend/package-lock.json
      - run: npm ci
      - run: npm test

  lint_chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          helm lint chart
          helm lint chart -f chart/values-staging.yaml
          helm lint chart -f chart/values-production.yaml

  # Both images are built on every push, even when only one component changed, because the chart
  # deploys them with one shared tag.
  build_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          tags: ghcr.io/con2/kompassi:${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/con2/kompassi:buildcache
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=registry,ref=ghcr.io/con2/kompassi:buildcache,mode=max' || '' }}

  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: kompassi-v2-frontend
          tags: ghcr.io/con2/kompassi2:${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/con2/kompassi2:buildcache
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'type=registry,ref=ghcr.io/con2/kompassi2:buildcache,mode=max' || '' }}

  deploy_staging:
    runs-on: qb-arc-runners
    needs: [test_backend, test_frontend, lint_chart, build_backend, build_frontend]
    # Skipped test jobs (nothing changed in that component) must not block the deploy.
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          helm upgrade --install kompassi chart \
            --namespace kompassi-staging \
            -f chart/values-staging.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 600s

  deploy_production:
    runs-on: qb-arc-runners
    needs: [test_backend, test_frontend, lint_chart, build_backend, build_frontend, deploy_staging]
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          helm upgrade --install kompassi chart \
            --namespace kompassi-production \
            -f chart/values-production.yaml \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 600s
