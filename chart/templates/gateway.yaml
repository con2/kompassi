{{- $hostnames := append .Values.backend.hostnames .Values.frontend.hostname -}}
# One Gateway for the namespace with an http and an https listener per hostname. cert-manager
# issues one certificate covering every https listener's hostname into the referenced Secret.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kompassi
  labels:
    {{- include "kompassi.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    {{- range $hostnames }}
    - name: {{ include "kompassi.listenerName" (list "http" .) }}
      protocol: HTTP
      port: 80
      hostname: {{ . | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: {{ include "kompassi.listenerName" (list "https" .) }}
      protocol: HTTPS
      port: 443
      hostname: {{ . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "kompassi.tlsSecretName" $ }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
