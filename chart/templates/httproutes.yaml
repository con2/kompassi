{{- $hostnames := append .Values.backend.hostnames .Values.frontend.hostname -}}
# Plain HTTP only redirects to HTTPS. Done per app instead of at the Traefik entrypoint so
# cert-manager's HTTP-01 solver Ingress keeps working. Attached to the http listeners by name: a
# parentRef without sectionName would also attach to the https listeners and loop.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  labels:
    {{- include "kompassi.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range $hostnames }}
    - name: kompassi
      sectionName: {{ include "kompassi.listenerName" (list "http" .) }}
    {{- end }}
  hostnames:
    {{- toYaml $hostnames | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kompassi
  labels:
    {{- include "kompassi.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.backend.hostnames }}
    - name: kompassi
      sectionName: {{ include "kompassi.listenerName" (list "https" .) }}
    {{- end }}
  hostnames:
    {{- toYaml .Values.backend.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/tickets-v2
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: body-100m }
      backendRefs:
        - name: uvicorn
          port: 7998
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: body-100m }
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: retry }
      backendRefs:
        - name: kompassi
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  labels:
    {{- include "kompassi.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: kompassi
      sectionName: {{ include "kompassi.listenerName" (list "https" .Values.frontend.hostname) }}
  hostnames:
    - {{ .Values.frontend.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: body-100m }
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: retry }
      backendRefs:
        - name: frontend
          port: 3000
