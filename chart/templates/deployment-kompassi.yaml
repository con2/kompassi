{{- $host := include "kompassi.primaryHostname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kompassi
  labels:
    {{- include "kompassi.labels" . | nindent 4 }}
    component: kompassi
spec:
  replicas: {{ .Values.backend.replicas.kompassi }}
  strategy:
    {{- include "kompassi.rollout" . | nindent 4 }}
  # The selector is immutable; it must stay equal to the one of the Deployment this chart adopted
  # from the pre-Helm manifests.
  selector:
    matchLabels:
      stack: kompassi
      component: kompassi
  template:
    metadata:
      labels:
        stack: kompassi
        component: kompassi
    spec:
      affinity:
        {{- include "kompassi.podAntiAffinity" "kompassi" | nindent 8 }}
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        {{- include "kompassi.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "kompassi.terminationGracePeriodSeconds" . }}
      initContainers:
        - name: setup
          image: {{ include "kompassi.backendImage" . | quote }}
          args: ["python", "manage.py", "setup"]
          env:
            {{- include "kompassi.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.setup | nindent 12 }}
          securityContext:
            {{- include "kompassi.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "kompassi.backendVolumeMounts" . | nindent 12 }}
      containers:
        - name: master
          image: {{ include "kompassi.backendImage" . | quote }}
          args:
            - gunicorn
            - --workers={{ .Values.backend.workers }}
            - --bind=0.0.0.0:8000
            - --capture-output
            - --timeout={{ .Values.backend.timeoutSeconds }}
            - kompassi.wsgi
          ports:
            - containerPort: 8000
          env:
            {{- include "kompassi.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.kompassi | nindent 12 }}
          securityContext:
            {{- include "kompassi.containerSecurityContext" . | nindent 12 }}
          lifecycle:
            {{- include "kompassi.preStop" . | nindent 12 }}
          startupProbe:
            {{- include "kompassi.httpGet" (list "/api/v1/status" 8000 $host) | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 60
          {{- if .Values.backend.probes.readiness }}
          readinessProbe:
            {{- include "kompassi.httpGet" (list "/api/v1/status" 8000 $host) | nindent 12 }}
            periodSeconds: 30
          {{- end }}
          {{- if .Values.backend.probes.liveness }}
          livenessProbe:
            {{- include "kompassi.httpGet" (list "/api/v1/status" 8000 $host) | nindent 12 }}
            initialDelaySeconds: 15
            periodSeconds: 30
          {{- end }}
          volumeMounts:
            {{- include "kompassi.backendVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "kompassi.backendVolumes" . | nindent 8 }}
