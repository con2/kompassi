services:
  router:
    image: busybox
    command: "sleep infinity"
    init: true
    # note: frontend, backend and garage have network_mode: service:router
    # because they to reach backend and garage at same address as browser
    # cannot publish ports from container that has this network_mode
    # also need to use separate router container so backend can restart
    # without breaking connectivity
    # see #357 #375 #408
    ports:
      - 3000:3000
      - 7998:7998
      - 8000:8000
      - 9000:9000
  backend:
    build: .
    init: true
    command: python manage.py docker_start
    restart: unless-stopped
    network_mode: service:router
    depends_on:
      - redis
      - postgres
    volumes: &volumes
      - ./kompassi:/usr/src/app/kompassi
      - ./dev-secrets:/usr/src/app/dev-secrets:rw
    tmpfs:
      - /tmp
    environment: &environment
      PYTHONUNBUFFERED: 1
      DEBUG: 1
      CACHE_URL: rediscache://redis/1
      ALLOWED_HOSTS: "*"
      MINIO_BUCKET_NAME: kompassi
      MINIO_ACCESS_KEY_ID: kompassi
      MINIO_SECRET_ACCESS_KEY: kompassikompassi
      MINIO_ENDPOINT_URL: http://localhost:9000
      AWS_DEFAULT_REGION: garage
      KOMPASSI_GENERATE_OIDC_RSA_PRIVATE_KEY_PATH: dev-secrets/id_rsa.key
      SECRET_KEY: The SECRET_KEY setting must not be empty.
      KOMPASSI_BASE_URL: http://localhost:8000
      TICKETS_BASE_URL: http://localhost:7998
      KOMPASSI_V2_BASE_URL: http://localhost:3000
      KOMPASSI_TICKETS_V2_API_KEY: secret
  uvicorn:
    build: .
    init: true
    command:
      - uvicorn
      - --workers=8
      - --host=0.0.0.0
      - --port=7998
      - --no-access-log
      - kompassi.tickets_v2.optimized_server.app:app
    network_mode: service:router
    depends_on:
      - postgres
    volumes: *volumes
    environment: *environment
  worker:
    build: .
    init: true
    restart: unless-stopped
    command:
      - python
      - manage.py
      - worker
    network_mode: service:router
    depends_on:
      - postgres
    volumes: *volumes
    environment: *environment
  frontend:
    build:
      context: kompassi-v2-frontend
      dockerfile: dev.Dockerfile
    init: true
    network_mode: service:router
    depends_on:
      - backend
    volumes:
      - ./kompassi-v2-frontend/src:/usr/src/app/src
    environment:
      NEXT_PUBLIC_KOMPASSI_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_TICKETS_BASE_URL: http://localhost:7998
      AUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      KOMPASSI_TICKETS_V2_API_KEY: secret
  postgres:
    # image: postgres
    build: sql
    init: true
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    # uncomment if you need to access postgres from host
    # note: you can use `docker compose exec postgres psql -U kompassi` to access psql cli
    # ports:
    #   - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    # tmpfs:
    #   - /var/lib/postgresql
    environment:
      POSTGRES_USER: kompassi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kompassi
  redis:
    image: redis
    init: true
    volumes:
      - redis-data:/data
  garage:
    image: dxflrs/garage:v2.4.1
    init: true
    network_mode: service:router
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
  garage-init:
    build: garage
    network_mode: service:router
    depends_on:
      - garage
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      # the garage CLI authenticates to the node with the node key stored here
      - garage-meta:/var/lib/garage/meta:ro
    environment:
      BUCKET_NAME: kompassi
      ACCESS_KEY_ID: kompassi
      SECRET_ACCESS_KEY: kompassikompassi

volumes:
  postgres-data: {}
  redis-data: {}
  garage-meta: {}
  garage-data: {}
