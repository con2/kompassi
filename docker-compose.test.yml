services:
  test:
    image: kompassi-test
    build:
      context: .
      target: test
    command: scripts/wait-for-it.sh -s -t 60 postgres:5432 -- pytest --reuse-db
    init: true
    links:
      # - rabbitmq
      - postgres
      # - memcache
    volumes:
      - ./kompassi:/usr/src/app/kompassi
      - test-cache:/usr/src/app/.pytest_cache
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      PYTHONDEVMODE: "1"
      TASKS_BACKEND: kompassi.task_queue.backend.ImmediateTaskBackend
  postgres:
    # image: postgres
    build: sql
    init: true
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: kompassi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: test_kompassi

volumes:
  test-cache: {}
  postgres-data: {}
