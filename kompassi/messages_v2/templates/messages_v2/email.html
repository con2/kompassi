{% load i18n %}<!doctype html>
<html lang="{{ language_code|default:'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Helvetica, Arial, sans-serif; color:#222222;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:4px;">
            <tr>
              <td style="padding:24px 32px 8px 32px; font-size:14px; color:#666666;">
                {{ event.name }}
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 24px 32px; font-size:16px; line-height:1.5;">
                {{ body_html|safe }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
